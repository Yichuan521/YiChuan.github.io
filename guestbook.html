<main class="page-shell page-main reveal"><p class="eyebrow">GUESTBOOK / 03</p><h1 class="page-title">留言板<span>。</span></h1><p class="page-lead">写下一句问候，让这个页面多一点真实的连接。</p><section class="guestbook-layout"><form class="message-form" id="guestbookForm"><label>昵称<input name="nickname" maxlength="24" placeholder="怎么称呼你？" required></label><label>邮箱<input name="email" type="email" maxlength="60" placeholder="your@email.com（可选，用于回复通知）"></label><label>留言<textarea name="content" maxlength="300" placeholder="在这里写下想说的话…" required></textarea><small id="messageLength">0 / 300</small></label><button class="button button-primary" type="submit">发布留言 <b>→</b></button><p class="form-message" id="guestbookStatus" aria-live="polite"></p></form><div><div class="section-heading message-heading"><h2>最新留言</h2><span id="messageNumber">—</span></div><div class="message-list" id="guestbookList"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div></section></main><footer class="site-footer"><p>© <span class="current-year"></span> 义川先森</p><p>DESIGNED &amp; BUILT WITH VANILLA WEB</p></footer><div class="search-dialog" id="searchDialog" aria-hidden="true"><div class="search-panel" role="dialog" aria-modal="true"><div class="search-field"><span></span><input id="globalSearchInput" type="search" placeholder="搜索项目、技术栈…"><button id="clearGlobalSearch" type="button">×</button><kbd>ESC</kbd></div><p>输入后按回车，跳转到项目页查看结果。</p></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script src="assets/js/main.js"></script></body></html>
